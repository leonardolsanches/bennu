
{% extends "base.html" %}

{% block title %}Editar Receita Planejada - Bennu Finance{% endblock %}

{% block content %}
<div class="page-container" style="max-width: 1200px; margin: 0 auto; padding: 24px;">
    <div class="page-header" style="margin-bottom: 24px;">
        <div style="display: flex; align-items: center; justify-content: space-between;">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div class="icon-circle" style="background-color: #059669;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" style="width: 16px; height: 16px;">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-9"/>
                        <path d="m9 9 3-3 3 3"/>
                        <path d="M21 3l-6 6"/>
                    </svg>
                </div>
                <h1 style="font-size: 24px; font-weight: bold; color: #374151; margin: 0;">Editar Receita Planejada</h1>
            </div>
            <button type="button" class="btn-link" onclick="window.history.back()">← Voltar</button>
        </div>
    </div>

    <form id="editar-planejamento-receita-form">
        <input type="hidden" id="linha-id" value="{{ linha_id }}">
        
        <section class="form-section">
            <div class="section-header-left">
                <div class="section-icon-left">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 20px; height: 20px;">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                        <circle cx="8.5" cy="7" r="4"/>
                        <line x1="20" y1="8" x2="20" y2="14"/>
                        <line x1="23" y1="11" x2="17" y2="11"/>
                    </svg>
                </div>
                <h2 class="section-title-left">Dados Iniciais da Receita</h2>
            </div>
            
            <!-- Linha 1: Versão | Ano | Empresa -->
            <div class="form-grid grid-3">
                <div class="form-field">
                    <label for="versao" class="form-label">Versão</label>
                    <input type="text" id="versao" name="versao" class="form-input" disabled>
                </div>
                <div class="form-field">
                    <label for="ano" class="form-label">Ano</label>
                    <input type="text" id="ano" name="ano" class="form-input" disabled>
                </div>
                <div class="form-field">
                    <label for="empresa" class="form-label required">Empresa</label>
                    <select id="empresa" name="empresa_id" class="form-select" required disabled>
                        <option value="">Selecione...</option>
                    </select>
                </div>
            </div>
            
            <!-- Linha 2: Cliente | Produto/Serviço -->
            <div class="form-grid grid-2">
                <div class="form-field">
                    <label for="cliente" class="form-label">Cliente</label>
                    <select id="cliente" name="cliente_id" class="form-select">
                        <option value="">Selecione...</option>
                    </select>
                </div>
                <div class="form-field">
                    <label for="produto_servico" class="form-label">Produto/Serviço</label>
                    <select id="produto_servico" name="produto_servico_id" class="form-select">
                        <option value="">Selecione...</option>
                    </select>
                </div>
            </div>
            
            <!-- Linha 3: Breve Descrição | Valor -->
            <div class="form-grid grid-2">
                <div class="form-field">
                    <label for="descricao" class="form-label">Breve Descrição</label>
                    <input type="text" id="descricao" name="descricao" class="form-input">
                </div>
                <div class="form-field">
                    <label for="valor_previsto" class="form-label">Valor Previsto</label>
                    <div class="currency-input">
                        <span class="currency-symbol">R$</span>
                        <input type="text" id="valor_previsto" name="valor_previsto" class="form-input currency" style="text-align: right;">
                    </div>
                </div>
            </div>
        </section>

        <div class="form-actions">
            <button type="button" class="btn btn-secondary" onclick="window.history.back()">Cancelar</button>
            <button type="submit" class="btn btn-primary">Salvar Alterações</button>
        </div>
    </form>
</div>

<script>
let linhaId = {{ linha_id }};

document.addEventListener('DOMContentLoaded', async function() {
    await carregarDados();
    await carregarLinha();
    
    document.getElementById('editar-planejamento-receita-form').addEventListener('submit', salvarAlteracoes);
});

async function carregarDados() {
    const empresasResp = await fetch('/api/empresas');
    const empresas = await empresasResp.json();
    popularSelect('empresa', empresas, 'id', 'nome_fantasia');
    
    const clientesResp = await fetch('/api/clientes');
    const clientes = await clientesResp.json();
    popularSelect('cliente', clientes, 'id', 'nome');
    
    const produtosResp = await fetch('/api/produtos-servicos');
    const produtos = await produtosResp.json();
    popularSelect('produto_servico', produtos, 'id', 'nome');
}

async function carregarLinha() {
    try {
        const response = await fetch(`/api/planejamento/linhas/${linhaId}`);
        if (!response.ok) throw new Error('Erro ao carregar linha');
        
        const linha = await response.json();
        
        // Preencher campos básicos
        document.getElementById('versao').value = linha.versao_nome || 'Versão Ativa';
        document.getElementById('ano').value = linha.ano || '';
        document.getElementById('empresa').value = linha.empresa_id || '';
        document.getElementById('cliente').value = linha.cliente_id || '';
        document.getElementById('descricao').value = linha.descricao || '';
        
        // Formatar valor como moeda brasileira
        if (linha.valor_previsto) {
            const valorFormatado = formatarMoeda(linha.valor_previsto);
            document.getElementById('valor_previsto').value = valorFormatado;
        }
    } catch (error) {
        console.error('Erro ao carregar linha:', error);
        alert('Erro ao carregar dados: ' + error.message);
    }
}

// Função para formatar valor como moeda brasileira
function formatarMoeda(valor) {
    if (!valor) return '';
    
    // Converter para número se for string
    const numero = typeof valor === 'string' ? parseFloat(valor) : valor;
    
    // Formatar com ponto para milhares e vírgula para centavos
    return numero.toLocaleString('pt-BR', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    });
}

// Função para desformatar moeda (converter de volta para número)
function desformatarMoeda(valorFormatado) {
    if (!valorFormatado) return 0;
    
    // Remover pontos (separadores de milhares) e substituir vírgula por ponto
    return parseFloat(valorFormatado.replace(/\./g, '').replace(',', '.'));
}

// Adicionar formatação automática ao campo de valor
document.addEventListener('DOMContentLoaded', function() {
    const valorInput = document.getElementById('valor_previsto');
    
    if (valorInput) {
        // Formatar ao perder o foco
        valorInput.addEventListener('blur', function() {
            const valorNumerico = desformatarMoeda(this.value);
            if (!isNaN(valorNumerico)) {
                this.value = formatarMoeda(valorNumerico);
            }
        });
        
        // Permitir apenas números, vírgula e ponto durante a digitação
        valorInput.addEventListener('keypress', function(e) {
            const char = String.fromCharCode(e.which);
            if (!/[\d,.]/.test(char)) {
                e.preventDefault();
            }
        });
    }
});

async function salvarAlteracoes(e) {
    e.preventDefault();
    
    // Desformatar o valor antes de enviar
    const valorFormatado = document.getElementById('valor_previsto').value;
    const valorNumerico = desformatarMoeda(valorFormatado);
    
    const data = {
        descricao: document.getElementById('descricao').value,
        valor_previsto: valorNumerico,
        cliente_id: document.getElementById('cliente').value ? parseInt(document.getElementById('cliente').value) : null,
        produto_servico_id: document.getElementById('produto_servico').value ? parseInt(document.getElementById('produto_servico').value) : null
    };
    
    try {
        const response = await fetch(`/api/planejamento/linhas/${linhaId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        
        if (!response.ok) throw new Error('Erro ao salvar');
        
        alert('Receita planejada atualizada com sucesso!');
        window.history.back();
    } catch (error) {
        console.error('Erro ao salvar:', error);
        alert('Erro ao salvar: ' + error.message);
    }
}

function popularSelect(selectId, data, valueKey, textKey) {
    const select = document.getElementById(selectId);
    select.innerHTML = '<option value="">Selecione...</option>';
    data.forEach(item => {
        const option = document.createElement('option');
        option.value = item[valueKey];
        option.textContent = item[textKey];
        select.appendChild(option);
    });
}
</script>
{% endblock %}
